header:
  version: 14

machine: raspberrypi5
distro: my-retro-os
target: my-retro-image

repos:
  meta-my-retro:
    path: meta-my-retro

  meta-custom-games:
    path: meta-custom-games

  meta-webserver-stream:
    path: meta-webserver-stream

  poky:
    url: "git://git.yoctoproject.org/poky"
    branch: "scarthgap"
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "git@github.com:openembedded/meta-openembedded.git"
    branch: "scarthgap"
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-webserver:

  meta-raspberrypi:
    url: "git@github.com:agherzan/meta-raspberrypi.git"
    branch: "scarthgap"
    path: layers/meta-raspberrypi

  meta-qt5:
    url: "git@github.com:meta-qt5/meta-qt5.git"
    branch: "scarthgap"
    path: layers/meta-qt5    

  meta-retro:
    url: "git@github.com:dev-0x7C6/meta-retro.git"
    branch: "scarthgap"
    path: layers/meta-retro    

local_conf_header:
  retro-settings: |
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
    # Use cache from previous project, in downloads and sstate-cache folders
    # Now build folder deletes and rebuilds should be faster
    CONF_VERSION = "2"
    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch commercial"

    # Enabling audio on pi fw
    ENABLE_AUDIO = "1"
    HDMI_FORCE_EDID_AUDIO = "1"

    RPI_EXTRA_CONFIG = " \n \
        dtparam=audio=on \n \
        hdmi_drive=2 \n \
        hdmi_force_hotplug=1 \n \
        config_hdmi_boost=4 \n \
        dtparam=krnbt=on \n \
        "

    # NVMe HAT: run the external PCIe link at Gen 1. At the default Gen 2 the
    # SSD dropped off the bus under sustained writes (formatting, big
    # downloads); at Gen 1 it is stable and still writes ~185 MB/s.
    # Fan: start at 35 C instead of 50 C so it is always gently on. The
    # nvme-fan service additionally speeds it up when the SSD gets hot.
    # Written flush-left on purpose (no leading spaces in config.txt).
    RPI_EXTRA_CONFIG:append = "\ndtparam=pciex1_gen=1\ndtparam=fan_temp0=35000\ndtparam=fan_temp0_speed=90\n"

    # 4K HEVC: the hardware decoder's frames (~16.6 MB each at 4K 10-bit) come
    # out of CMA, and the 64 MB default runs out after two frames. 512 MB is
    # what LibreELEC uses on the Pi 5. Set it through the vc4 overlay, never
    # with cma= on the kernel cmdline: that left the firmware mailbox without
    # DMA memory and stopped the decoder from probing at all.
    VC4DTBO = "vc4-kms-v3d,cma-512"

    # Systemd initialization
    DISTRO_FEATURES:append = " systemd"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"

    # Disk monitoring
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"